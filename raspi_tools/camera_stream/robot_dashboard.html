<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>配管ロボット運転モニタ</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --bg: #0d1014;
      --panel: #171b20;
      --panel2: #20262d;
      --line: #303944;
      --text: #f3f6f8;
      --muted: #9ba7b3;
      --accent: #4fb4ff;
      --warn: #ffb84f;
      --ok: #72e59a;
      --bad: #ff6f79;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
    }
    button { font: inherit; }
    .grid {
      height: 100vh;
      display: grid;
      grid-template-rows: 45vh 55vh;
    }
    .cams {
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
      padding: 6px;
      border-bottom: 1px solid var(--line);
    }
    .cam, .panel {
      min-width: 0;
      min-height: 0;
      border: 1px solid var(--line);
      background: var(--panel);
    }
    .cam {
      display: grid;
      grid-template-rows: 28px minmax(0, 1fr);
    }
    .title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 28px;
      padding: 0 8px;
      font-size: 12px;
      color: #dbe3ea;
      background: var(--panel2);
      border-bottom: 1px solid var(--line);
      white-space: nowrap;
      overflow: hidden;
    }
    .title a { color: var(--accent); text-decoration: none; }
    .cam img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      display: block;
    }
    .status {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(430px, 1.65fr) repeat(3, minmax(185px, 1fr));
      grid-template-rows: repeat(2, minmax(0, 1fr));
      gap: 7px;
      padding: 7px;
    }
    .panel {
      display: grid;
      grid-template-rows: 31px minmax(0, 1fr);
    }
    .pose-panel { grid-row: 1 / 3; }
    .panel h2 {
      margin: 0;
      padding: 7px 10px;
      font-size: 13px;
      font-weight: 650;
      border-bottom: 1px solid var(--line);
      background: var(--panel2);
    }
    .scene-wrap {
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px),
        radial-gradient(circle at 50% 52%, #24313c 0, #101419 68%);
      background-size: 34px 34px, 34px 34px, auto;
    }
    #robotScene {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    .pose-top {
      position: absolute;
      top: 9px;
      left: 9px;
      right: 9px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      pointer-events: none;
    }
    .badges { display: flex; flex-wrap: wrap; gap: 5px; }
    .badge {
      padding: 4px 8px;
      border: 1px solid #46515d;
      border-radius: 999px;
      background: rgba(13, 17, 22, 0.88);
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .02em;
    }
    .badge.ok { border-color: #41895d; color: var(--ok); }
    .badge.warn { border-color: #9a6d2c; color: var(--warn); }
    .badge.bad { border-color: #a8444d; color: var(--bad); }
    .pose-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 5px;
      pointer-events: auto;
    }
    .pose-actions button {
      border: 1px solid #4a5865;
      border-radius: 4px;
      padding: 5px 8px;
      color: #dce7ef;
      background: rgba(25, 31, 38, 0.92);
      cursor: pointer;
      font-size: 11px;
    }
    .pose-actions button:hover { border-color: var(--accent); }
    .pose-actions button.active {
      border-color: var(--warn);
      color: #1a1104;
      background: var(--warn);
      font-weight: 700;
    }
    .alert-box {
      position: absolute;
      top: 45px;
      left: 9px;
      max-width: calc(100% - 18px);
      padding: 7px 10px;
      border: 1px solid #9a6d2c;
      border-radius: 5px;
      background: rgba(54, 34, 8, .92);
      color: #ffd99f;
      font-size: 12px;
      font-weight: 700;
    }
    .alert-box.bad {
      border-color: #a8444d;
      background: rgba(64, 15, 21, .94);
      color: #ffc1c6;
    }
    .alert-box[hidden] { display: none; }
    .sensor-test {
      position: absolute;
      z-index: 8;
      top: 52px;
      right: 10px;
      width: 285px;
      padding: 9px;
      border: 1px solid #47738f;
      border-radius: 6px;
      background: rgba(10, 22, 31, .94);
      box-shadow: 0 4px 18px rgba(0,0,0,.35);
    }
    .sensor-test[hidden] { display: none; }
    .sensor-test-row {
      display: grid;
      grid-template-columns: 92px 1fr 62px;
      gap: 7px;
      align-items: center;
      margin: 6px 0;
      font-size: 11px;
    }
    .sensor-test-row input { width: 100%; accent-color: var(--ok); }
    .sensor-test-row output { text-align: right; font-variant-numeric: tabular-nums; }
    .hud {
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: 8px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      color: #d4dde5;
      font-size: 12px;
      pointer-events: none;
      text-shadow: 0 1px 2px #000;
    }
    .hud .sub { color: var(--muted); font-size: 11px; }
    .hud-right { text-align: right; }
    .kv {
      padding: 7px 9px;
      overflow: auto;
      display: grid;
      align-content: start;
      gap: 5px;
      font-size: 12px;
    }
    .row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 9px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      padding-bottom: 3px;
    }
    .key { color: var(--muted); }
    .value { font-variant-numeric: tabular-nums; text-align: right; }
    .raw {
      color: #7f8a95;
      font-size: 10px;
      line-height: 1.3;
      word-break: break-all;
      padding-top: 3px;
    }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
      justify-content: end;
      max-width: 280px;
    }
    .chip {
      min-width: 24px;
      padding: 1px 5px;
      border: 1px solid #3a424c;
      border-radius: 4px;
      color: #c7d0da;
      background: #15181c;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }
    .chip.on { border-color: #8ecbff; color: #061016; background: var(--ok); }
    .pill {
      display: inline-block;
      min-width: 42px;
      padding: 1px 7px;
      border-radius: 999px;
      border: 1px solid #3a424c;
      color: var(--muted);
      background: #14171b;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }
    .pill.on { color: #071017; border-color: #9cf7b9; background: var(--ok); font-weight: 700; }
    .age-ok { color: var(--ok); }
    .age-warn { color: var(--warn); }
    .age-bad { color: var(--bad); }
    @media (max-width: 1350px) {
      body { overflow: auto; }
      .grid { height: auto; grid-template-rows: auto auto; }
      .cams { grid-template-columns: 1fr; height: auto; }
      .cam { height: 30vh; min-height: 220px; }
      .status { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: auto; }
      .pose-panel { grid-column: 1 / 3; grid-row: auto; min-height: 500px; }
      .panel { min-height: 280px; }
    }
    @media (max-width: 760px) {
      .status { grid-template-columns: 1fr; }
      .pose-panel { grid-column: auto; min-height: 430px; }
    }
  </style>
</head>
<body>
  <div class="grid">
    <section class="cams">
      <div class="cam">
        <div class="title"><span>Camera 1 / global_left</span><a class="cam-link" data-port="8080" href="#" target="_blank">別画面</a></div>
        <img class="cam-stream" data-port="8080" alt="camera 1">
      </div>
      <div class="cam">
        <div class="title"><span>Camera 2 / usb_16mp</span><a class="cam-link" data-port="8081" href="#" target="_blank">別画面</a></div>
        <img class="cam-stream" data-port="8081" alt="camera 2">
      </div>
      <div class="cam">
        <div class="title"><span>Camera 3 / global_right</span><a class="cam-link" data-port="8082" href="#" target="_blank">別画面</a></div>
        <img class="cam-stream" data-port="8082" alt="camera 3">
      </div>
    </section>

    <section class="status">
      <div class="panel pose-panel">
        <h2>配管内3D姿勢・運転状態（PC描画）</h2>
        <div class="scene-wrap">
          <canvas id="robotScene"></canvas>
          <div class="pose-top">
            <div class="badges">
              <span class="badge warn" id="apiBadge">API 未接続</span>
              <span class="badge" id="modeBadge">停止</span>
              <span class="badge warn" id="poseBadge">姿勢値なし</span>
              <span class="badge" id="partBadge" hidden>回転対象：モデル全体</span>
            </div>
            <div class="pose-actions">
              <button id="fusionViewButton" type="button">Fusion視点</button>
              <button id="sensorTestButton" type="button">センサ入力テスト</button>
              <button id="pipeVisibilityButton" type="button">配管を隠す</button>
              <button id="partSelectButton" type="button" hidden>回転対象を選択</button>
              <button id="wholeModelButton" type="button" hidden>全体回転へ戻す</button>
              <button id="zeroPoseButton" type="button">現在姿勢を0°</button>
              <button id="resetPoseButton" type="button">絶対角へ戻す</button>
            </div>
          </div>
          <div class="alert-box" id="alertBox" hidden></div>
          <div class="sensor-test" id="sensorTestPanel" hidden>
            <div style="font-size:12px;font-weight:700">PC模擬入力（実機へは送信しません）</div>
            <label class="sensor-test-row"><span>センサ1 roll</span><input id="testSensor1" type="range" min="-180" max="180" value="0" step="1"><output id="testSensor1Value">0°</output></label>
            <label class="sensor-test-row"><span>センサ2 roll</span><input id="testSensor2" type="range" min="-90" max="90" value="0" step="1"><output id="testSensor2Value">0°</output></label>
            <label class="sensor-test-row"><span>スライダ6</span><input id="testSlider6" type="range" min="43" max="73" value="43" step="0.001"><output id="testSlider6Value">43 mm</output></label>
            <label class="sensor-test-row"><span>スライダ11</span><input id="testSlider11" type="range" min="-121.764" max="-68.621" value="-121.764" step="0.001"><output id="testSlider11Value">-121.8 mm</output></label>
            <label class="sensor-test-row"><span>工具角度</span><input id="testTool" type="range" min="-180" max="180" value="0" step="5"><output id="testToolValue">0°</output></label>
          </div>
          <div class="hud">
            <div>
              <div id="poseLabel">roll - / pitch -</div>
              <div class="sub" id="poseSource">本体センサ待機中</div>
            </div>
            <div class="hud-right">
              <div id="motionLabel">実測：車輪停止 / 工具停止</div>
              <div class="sub" id="forceLabel">距離 - / 圧力 -</div>
              <div class="sub" id="modelLabel">実STLモデルを読み込み中</div>
            </div>
          </div>
        </div>
      </div>
      <div class="panel"><h2>姿勢センサ / 距離・圧力</h2><div class="kv" id="imuPanel"></div></div>
      <div class="panel"><h2>本体加速度センサ（姿勢優先）</h2><div class="kv" id="bodyAccelPanel"></div></div>
      <div class="panel"><h2>走行・ロールモータ / 電流</h2><div class="kv" id="motorPanel"></div></div>
      <div class="panel"><h2>電磁弁 / エア状態</h2><div class="kv" id="valvePanel"></div></div>
      <div class="panel"><h2>コントローラ入力</h2><div class="kv" id="controllerPanel"></div></div>
    </section>
  </div>

  <script src="./vendor/three.min.js"></script>
  <script>
    "use strict";
    if (window.location.protocol === "file:") {
      const query = window.location.search || "";
      window.location.replace(
        `http://127.0.0.1:8095/robot_dashboard.html${query}`
      );
    }

    const elements = {
      poseLabel: document.getElementById("poseLabel"),
      poseSource: document.getElementById("poseSource"),
      motionLabel: document.getElementById("motionLabel"),
      forceLabel: document.getElementById("forceLabel"),
      modelLabel: document.getElementById("modelLabel"),
      apiBadge: document.getElementById("apiBadge"),
      modeBadge: document.getElementById("modeBadge"),
      poseBadge: document.getElementById("poseBadge"),
      partBadge: document.getElementById("partBadge"),
      fusionViewButton: document.getElementById("fusionViewButton"),
      pipeVisibilityButton: document.getElementById("pipeVisibilityButton"),
      sensorTestButton: document.getElementById("sensorTestButton"),
      sensorTestPanel: document.getElementById("sensorTestPanel"),
      testSensor1: document.getElementById("testSensor1"),
      testSensor2: document.getElementById("testSensor2"),
      testSlider6: document.getElementById("testSlider6"),
      testSlider11: document.getElementById("testSlider11"),
      testTool: document.getElementById("testTool"),
      partSelectButton: document.getElementById("partSelectButton"),
      wholeModelButton: document.getElementById("wholeModelButton"),
      alertBox: document.getElementById("alertBox"),
      imuPanel: document.getElementById("imuPanel"),
      bodyAccelPanel: document.getElementById("bodyAccelPanel"),
      motorPanel: document.getElementById("motorPanel"),
      valvePanel: document.getElementById("valvePanel"),
      controllerPanel: document.getElementById("controllerPanel"),
      canvas: document.getElementById("robotScene")
    };

    const PIPE_INNER_DIAMETER_MM = 240;
    const PIPE_RADIUS_MM = PIPE_INNER_DIAMETER_MM / 2;
    const PIPE_LENGTH_MM = 1000;
    // 配管中心軸は回転9の軸から工具半径方向（Fusion座標Y）へ -5.5 mm。
    const PIPE_AXIS_FROM_ROTATION9_RADIAL_MM = -5.5;
    const ROLL_WARNING_DEG = 3;
    const STALE_SEC = 2;
    const ROTATION9_SMOOTH_TAU_S = 0.3;
    const ROTATION9_DEADBAND_DEG = 0.25;
    const SLIDER11_DISTANCE_MEDIAN_SAMPLES = 7;
    const SLIDER11_DISTANCE_SMOOTH_TAU_S = 0.6;
    const SLIDER11_DISTANCE_DEADBAND_MM = 1.5;
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(39, 1, 0.1, 5000);
    camera.up.set(0, 0, 1);
    camera.position.set(180, 900, 450);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ canvas: elements.canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    if (THREE.SRGBColorSpace) renderer.outputColorSpace = THREE.SRGBColorSpace;

    const robotRoot = new THREE.Group();
    robotRoot.rotation.order = "YXZ";
    const modelGroup = new THREE.Group();
    const mechanismGroup = new THREE.Group();
    const pipeReferenceGroup = new THREE.Group();
    robotRoot.add(modelGroup, mechanismGroup);
    scene.add(robotRoot, pipeReferenceGroup);

    scene.add(new THREE.HemisphereLight(0xd8f1ff, 0x15191e, 1.35));
    const keyLight = new THREE.DirectionalLight(0xffffff, 1.05);
    keyLight.position.set(-180, -260, 420);
    scene.add(keyLight);
    const fillLight = new THREE.DirectionalLight(0x9acbff, 0.55);
    fillLight.position.set(220, 160, 180);
    scene.add(fillLight);

    const materialBody = new THREE.MeshStandardMaterial({ color: 0xb7b5aa, metalness: 0.18, roughness: 0.58 });
    const materialDrive = new THREE.MeshStandardMaterial({ color: 0xaeb4b6, metalness: 0.16, roughness: 0.56 });
    const materialPassive = new THREE.MeshStandardMaterial({ color: 0x353c44, roughness: 0.72 });
    const materialStructure = new THREE.MeshStandardMaterial({ color: 0xc0beb3, metalness: 0.2, roughness: 0.52 });
    const materialAccent = new THREE.MeshStandardMaterial({ color: 0xb0afa7, metalness: 0.15, roughness: 0.6 });
    const materialDanger = new THREE.MeshStandardMaterial({ color: 0xff5f6d, emissive: 0x3c070c, roughness: 0.35 });
    const materialPipe = new THREE.MeshBasicMaterial({ color: 0x55bfff, transparent: true, opacity: 0.055, wireframe: true, depthWrite: false });
    const cadRollUniform = { value: 0 };

    let driveWheels = [];
    let passiveWheels = [];
    let pressLinks = [];
    let cutterGroup;
    let drillTool;
    let grinderSpinGroup;
    let distanceBeam;
    let distanceTarget;
    let pressForceArrows = [];
    let axialArrow;
    let rollArrow;
    let cadMesh;
    let cadComponentIds;
    let cadSelectionAttribute;
    let cadComponentCount = 0;
    let cadDisplayScale = 1;
    let cadJointRuntimes = [];
    let cadModelConfig = null;
    let urdfLoaded = false;
    let urdfJointsValidated = false;
    let urdfJointRuntimes = [];
    let urdfJointByChild = new Map();
    let validatedModelLoaded = false;
    let validatedAssemblyRoot = null;
    let validatedJointRuntimes = new Map();
    let validatedComponentMeshes = [];
    let selectingCadParts = false;
    let cadRotationMode = localStorage.getItem("pipeRobotCadRotationMode") || "whole";
    const selectedCadComponents = new Set(
      JSON.parse(localStorage.getItem("pipeRobotCadSelectedComponents") || "[]")
        .filter((value) => Number.isInteger(value) && value >= 0)
    );
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    let currentState = {};
    let latestPose = null;
    let smoothRoll = 0;
    let smoothPitch = 0;
    let zeroRoll = Number(localStorage.getItem("pipeRobotZeroRoll") || 0);
    let zeroPitch = Number(localStorage.getItem("pipeRobotZeroPitch") || 0);
    let zeroSensor2Roll = 0;
    let slider11DistanceZeroMm = null;
    let slider11FilteredDistanceMm = null;
    let slider11LastDistanceUpdatedS = null;
    const slider11DistanceSamples = [];
    let lastApiAt = 0;
    let lastFrameAt = performance.now();
    let cutterPhase = 0;
    let sensorTestEnabled = new URLSearchParams(window.location.search).get("demo") === "1";
    let cutWasActive = false;
    let cutStartRoll = null;
    let mismatchStartedAt = null;

    function initCameraUrls() {
      const requestedPi = new URLSearchParams(window.location.search).get("pi");
      const host = requestedPi || window.location.hostname || "192.168.0.218";
      document.querySelectorAll(".cam-stream, .cam-link").forEach((el) => {
        const url = `http://${host}:${el.dataset.port}/?action=stream`;
        if (el.tagName === "IMG") {
          el.dataset.baseUrl = url;
          el.src = `${url}&_=${Date.now()}`;
          el.onerror = () => setTimeout(() => { el.src = `${url}&_=${Date.now()}`; }, 1500);
        } else {
          el.href = url;
        }
      });
    }

    function refreshCameraStreams() {
      document.querySelectorAll(".cam-stream").forEach((el) => {
        if (el.dataset.baseUrl) el.src = `${el.dataset.baseUrl}&_=${Date.now()}`;
      });
    }

    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" })[c]);
    }

    function fmt(value, digits = 2, unit = "") {
      if (value === null || value === undefined || !Number.isFinite(Number(value))) return "-";
      return `${Number(value).toFixed(digits)}${unit}`;
    }

    function ageSec(updatedS) {
      if (!Number.isFinite(Number(updatedS)) || Number(updatedS) <= 0) return Infinity;
      return Math.max(0, Date.now() / 1000 - Number(updatedS));
    }

    function ageValue(updatedS) {
      const age = ageSec(updatedS);
      if (!Number.isFinite(age)) return { text: "-", cls: "age-warn" };
      if (age < 2) return { text: fmt(age, 1, " 秒前"), cls: "age-ok" };
      if (age < 8) return { text: fmt(age, 1, " 秒前"), cls: "age-warn" };
      return { text: fmt(age, 1, " 秒前"), cls: "age-bad" };
    }

    function row(key, value, cls = "") {
      return `<div class="row"><span class="key">${esc(key)}</span><span class="value ${cls}">${value}</span></div>`;
    }

    function chips(values, pressedIndexes = new Set()) {
      if (!Array.isArray(values) || values.length === 0) return "-";
      return `<div class="chips">${values.map((v, i) => {
        const value = Array.isArray(v) ? v.join("/") : (Number.isFinite(Number(v)) ? Number(v).toFixed(2) : v);
        return `<span class="chip ${pressedIndexes.has(i) ? "on" : ""}">${i}:${esc(value)}</span>`;
      }).join("")}</div>`;
    }

    function valveStatus(value) {
      const on = Number(value) === 1 || value === true || value === "1";
      return `<span class="pill ${on ? "on" : ""}">${on ? "ON" : "OFF"}</span>`;
    }

    function isOn(value) {
      return Number(value) === 1 || value === true || value === "1";
    }

    function shortestAngle(angle) {
      return ((angle + 180) % 360 + 360) % 360 - 180;
    }

    function smoothAngle(current, target, factor) {
      return current + shortestAngle(target - current) * factor;
    }

    function smoothJointAngle(current, target, dt) {
      const delta = shortestAngle(target - current);
      if (Math.abs(delta) <= ROTATION9_DEADBAND_DEG) return current;
      const factor = 1 - Math.exp(-Math.max(0, dt) / ROTATION9_SMOOTH_TAU_S);
      return shortestAngle(current + delta * factor);
    }

    function median(values) {
      const sorted = [...values].sort((a, b) => a - b);
      return sorted[Math.floor(sorted.length / 2)];
    }

    function drillDistanceExtensionMm(dt) {
      const distanceValue = (currentState.sensors || {}).distance_mm;
      const distance = distanceValue === null || distanceValue === undefined
        ? NaN
        : Number(distanceValue);
      const updatedS = Number((currentState.imu || {}).updated_s);
      if (
        !Number.isFinite(distance)
        || distance < 0
        || !Number.isFinite(updatedS)
        || ageSec(updatedS) >= STALE_SEC
      ) {
        return null;
      }

      if (updatedS !== slider11LastDistanceUpdatedS) {
        slider11LastDistanceUpdatedS = updatedS;
        slider11DistanceSamples.push(distance);
        while (slider11DistanceSamples.length > SLIDER11_DISTANCE_MEDIAN_SAMPLES) {
          slider11DistanceSamples.shift();
        }
      }

      if (slider11DistanceSamples.length < 5) return null;
      const filteredTarget = median(slider11DistanceSamples);
      if (!Number.isFinite(slider11FilteredDistanceMm)) {
        slider11FilteredDistanceMm = filteredTarget;
      } else {
        const factor = 1 - Math.exp(
          -Math.max(0, dt) / SLIDER11_DISTANCE_SMOOTH_TAU_S
        );
        slider11FilteredDistanceMm += (
          filteredTarget - slider11FilteredDistanceMm
        ) * factor;
      }
      if (!Number.isFinite(slider11DistanceZeroMm)) {
        slider11DistanceZeroMm = slider11FilteredDistanceMm;
      }

      // The distance increases as the drill slider moves in the + direction.
      return slider11FilteredDistanceMm - slider11DistanceZeroMm;
    }
